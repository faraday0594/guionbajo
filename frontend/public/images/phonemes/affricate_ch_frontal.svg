<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skinG-affricate_chf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddb89a"/>
      <stop offset="100%" stop-color="#c9956c"/>
    </linearGradient>
    <linearGradient id="lipG-affricate_chf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8788a"/>
      <stop offset="100%" stop-color="#b83b58"/>
    </linearGradient>
    <radialGradient id="cavG-affricate_chf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e060a"/>
      <stop offset="100%" stop-color="#0a0103"/>
    </radialGradient>
  </defs>
  <rect width="300" height="260" rx="16" fill="#0b0f1a"/>

  <!-- Voicing Status Badge: SORDO -->
  <g transform="translate(216, 14)">
    <rect width="70" height="20" rx="10" fill="#334155" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#64748b"/>
    <text x="20" y="13.5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">SORDO</text>
  </g>

  
  <!-- Face contour -->
  <ellipse cx="150" cy="140" rx="100" ry="120" fill="url(#skinG-affricate_chf)" opacity="0.12"/>
  <!-- Nose base & nostrils -->
  <path d="M 136 72 Q 142 68 150 69 Q 158 68 164 72" fill="none" stroke="#966b4f" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="143" cy="73" rx="3.5" ry="1.8" fill="#2d170d" opacity="0.4"/>
  <ellipse cx="157" cy="73" rx="3.5" ry="1.8" fill="#2d170d" opacity="0.4"/>
  <!-- Philtrum -->
  <path d="M 147 75 Q 146 85 144 96" stroke="#8b5a38" stroke-width="1" stroke-linecap="round" opacity="0.3" fill="none"/>
  <path d="M 153 75 Q 154 85 156 96" stroke="#8b5a38" stroke-width="1" stroke-linecap="round" opacity="0.3" fill="none"/>
  <!-- Oral cavity inside flared lips -->
  <ellipse cx="150" cy="136" rx="26" ry="18" fill="url(#cavG-affricate_chf)" stroke="#0a0103" stroke-width="1"/>
  <clipPath id="clip-flared-affricate_chf"><ellipse cx="150" cy="136" rx="26" ry="18"/></clipPath>
  <g clip-path="url(#clip-flared-affricate_chf)">
    <!-- Upper teeth closely aligned behind flared lips -->
    <rect x="127" y="123" width="10" height="12" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="138.5" y="122" width="11" height="13" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="151" y="122" width="11" height="13" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="163.5" y="123" width="10" height="12" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <!-- Narrow turbulent air jet slit between dental arches -->
    <line x1="125" y1="135.5" x2="175" y2="135.5" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>
    <!-- Lower teeth closely aligned -->
    <rect x="130" y="137" width="9.5" height="10" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="140.5" y="136.5" width="10" height="10.5" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="151.5" y="136.5" width="10" height="10.5" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="162" y="137" width="9.5" height="10" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
  </g>
  <!-- Flared protruded fleshy lips (trumpet-like protrusion) -->
  <path d="
    M 150 98 C 136 98, 118 106, 112 118 C 106 128, 106 144, 112 154
    C 118 166, 136 174, 150 174 C 164 174, 182 166, 188 154
    C 194 144, 194 128, 188 118 C 182 106, 164 98, 150 98 Z
    M 150 118 C 137 118, 126 126, 126 136 C 126 146, 137 154, 150 154
    C 163 154, 174 146, 174 136 C 174 126, 163 118, 150 118 Z"
    fill-rule="evenodd" fill="url(#lipG-affricate_chf)" stroke="#731628" stroke-width="1.2"/>
  <!-- Rim highlight -->
  <ellipse cx="150" cy="136" rx="24" ry="18" fill="none" stroke="#480815" stroke-width="1.2" opacity="0.6"/>
  <!-- Protrusion radial creases -->
  <path d="M 120 120 Q 125 125 130 128" stroke="#5a0e1e" stroke-width="1" opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M 180 120 Q 175 125 170 128" stroke="#5a0e1e" stroke-width="1" opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M 120 152 Q 125 147 130 144" stroke="#5a0e1e" stroke-width="1" opacity="0.6" fill="none" stroke-linecap="round"/>
  <path d="M 180 152 Q 175 147 170 144" stroke="#5a0e1e" stroke-width="1" opacity="0.6" fill="none" stroke-linecap="round"/>
  <!-- Fleshy highlights -->
  <ellipse cx="150" cy="166" rx="14" ry="3.5" fill="white" opacity="0.25"/>
  <ellipse cx="150" cy="106" rx="10" ry="2.5" fill="white" opacity="0.2"/>
  
  <!-- Affricate Plosive-Fricative Release Burst Sparks -->
  <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
    <line x1="116" y1="126" x2="106" y2="118"/>
    <line x1="112" y1="136" x2="100" y2="136"/>
    <line x1="116" y1="146" x2="106" y2="154"/>
    <line x1="184" y1="126" x2="194" y2="118"/>
    <line x1="188" y1="136" x2="200" y2="136"/>
    <line x1="184" y1="146" x2="194" y2="154"/>
  </g>
  <!-- Mini burst label -->
  <text x="150" y="88" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="1">EXPLOSION + SALIDA FRICATIVA</text>
  <text x="150" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Explosión Rápida 'CH' (Sorda)</text>
</svg>