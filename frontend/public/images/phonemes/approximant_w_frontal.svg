<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#090D16"/>
  <circle cx="100" cy="100" r="85" fill="url(#bgGlow)"/>
  
        <!-- Small Tight Pursed Circle -->
        <ellipse cx="100" cy="100" rx="35" ry="35" fill="#F43F5E" stroke="#FDA4AF" stroke-width="3"/>
        <circle cx="100" cy="100" r="14" fill="#0F172A"/>
        <!-- Protruding lip folds -->
        <path d="M 75 100 Q 100 90 125 100" stroke="#FDA4AF" stroke-width="2" fill="none"/>
        <path d="M 75 100 Q 100 110 125 100" stroke="#E11D48" stroke-width="2" fill="none"/>
        
  <text x="100" y="180" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Labios en O Apretada (Silbido)</text>
</svg>