<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skinG-fricative_hf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddb89a"/>
      <stop offset="100%" stop-color="#c9956c"/>
    </linearGradient>
    <linearGradient id="lipG-fricative_hf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8788a"/>
      <stop offset="100%" stop-color="#b83b58"/>
    </linearGradient>
    <radialGradient id="cavG-fricative_hf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e060a"/>
      <stop offset="100%" stop-color="#0a0103"/>
    </radialGradient>
  </defs>
  <rect width="300" height="260" rx="16" fill="#0b0f1a"/>

  <!-- Voicing Status Badge: SORDO -->
  <g transform="translate(216, 14)">
    <rect width="70" height="20" rx="10" fill="#334155" fill-opacity="0.25" stroke="#475569" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#64748b"/>
    <text x="20" y="13.5" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">SORDO</text>
  </g>

  
  <!-- Face contour -->
  <ellipse cx="150" cy="140" rx="100" ry="120" fill="url(#skinG-fricative_hf)" opacity="0.12"/>
  <!-- Nose base & nostrils -->
  <path d="M 136 72 Q 142 68 150 69 Q 158 68 164 72" fill="none" stroke="#966b4f" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="143" cy="73" rx="3.5" ry="1.8" fill="#2d170d" opacity="0.4"/>
  <ellipse cx="157" cy="73" rx="3.5" ry="1.8" fill="#2d170d" opacity="0.4"/>
  <!-- Philtrum -->
  <path d="M 147 75 Q 146 85 144 96" stroke="#8b5a38" stroke-width="1" stroke-linecap="round" opacity="0.3" fill="none"/>
  <path d="M 153 75 Q 154 85 156 96" stroke="#8b5a38" stroke-width="1" stroke-linecap="round" opacity="0.3" fill="none"/>
  <!-- Relaxed open oral cavity -->
  <ellipse cx="150" cy="136" rx="36" ry="18" fill="url(#cavG-fricative_hf)" stroke="#220306" stroke-width="1"/>
  <clipPath id="clip-no-fricative_hf"><ellipse cx="150" cy="136" rx="36" ry="18"/></clipPath>
  <g clip-path="url(#clip-no-fricative_hf)">
    <rect x="126.0" y="124" width="11.0" height="13.2" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="138.0" y="124" width="11.0" height="13.2" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="150.0" y="124" width="11.0" height="13.2" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="162.0" y="124" width="11.0" height="13.2" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <!-- Resting flat tongue floor -->
    <path d="M 115 146 Q 150 143 185 146 L 185 160 L 115 160 Z" fill="#d4615a" opacity="0.8"/>
    <rect x="132.0" y="142" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="144.0" y="142" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="156.0" y="142" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <!-- Free glottal breath flow indicator -->
    <ellipse cx="150" cy="136" rx="14" ry="4" fill="#38bdf8" opacity="0.25"/>
  </g>
  <!-- Relaxed lips -->
  <path d="M 106 136 C 118 123, 134 121, 150 124 C 166 121, 182 123, 194 136 C 180 131, 166 129, 150 130 C 134 129, 120 131, 106 136 Z"
    fill="url(#lipG-fricative_hf)" stroke="#8e243c" stroke-width="1.2"/>
  <path d="M 106 136 C 118 143, 134 146, 150 146 C 166 146, 182 143, 194 136 C 184 156, 168 162, 150 162 C 132 162, 116 156, 106 136 Z"
    fill="url(#lipG-fricative_hf)" stroke="#8e243c" stroke-width="1.2"/>
  <ellipse cx="150" cy="154" rx="14" ry="3.5" fill="white" opacity="0.2"/>
  <text x="150" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Boca Relajada (Aliento Glotal)</text>
</svg>