<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="latGlow" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#090D16"/>
  <circle cx="100" cy="100" r="85" fill="url(#latGlow)"/>

  <!-- Head / Pharynx Walls -->
  <!-- Posterior Pharyngeal Wall -->
  <path d="M 35 60 L 35 165" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <!-- Hard & Soft Palate / Uvula -->
  <path d="M 40 60 Q 60 55 95 55 Q 130 55 145 75" stroke="#475569" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Upper Incisor -->
  <path d="M 148 76 L 152 92 L 145 92 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <!-- Lower Incisor -->
  <path d="M 148 125 L 152 108 L 145 108 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <!-- Upper Lip Contour -->
  <path d="M 152 75 Q 165 80 162 90" stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Lower Lip Contour -->
  <path d="M 152 125 Q 165 120 162 110" stroke="#475569" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Tongue Body -->
  <path d="M 45 155 Q 70 140 95 125 Q 120 100 142 80 Q 140 105 128 135 Q 105 155 45 155 Z" fill="#FB7185" stroke="#F43F5E" stroke-width="2.5"/>

  <!-- Airflow Stream Arrow -->
  <path d="M 125 70 Q 145 72 165 90" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4,3" fill="none" stroke-linecap="round"/>

  <!-- Label -->
  <text x="100" y="180" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Alveolar Sonoro Vibrante</text>
</svg>