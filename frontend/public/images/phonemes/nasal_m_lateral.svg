<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="tngG-nasal_ml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8856e"/>
      <stop offset="100%" stop-color="#c45a3c"/>
    </linearGradient>
    <linearGradient id="boneG-nasal_ml" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4c8b8"/>
      <stop offset="100%" stop-color="#a89880"/>
    </linearGradient>
  </defs>
  <rect width="400" height="340" rx="16" fill="#0b0f1a"/>

  <!-- Outer face profile -->
  <path d="M 130 20 Q 115 30 110 50 Q 108 70 95 85 Q 80 95 72 100 Q 78 108 82 112 Q 72 118 68 125"
    fill="none" stroke="#7a6555" stroke-width="2" opacity="0.65"/>
  <path d="M 68 160 Q 65 180 72 200 Q 85 225 110 240"
    fill="none" stroke="#7a6555" stroke-width="2" opacity="0.65"/>

  <!-- Nasal Cavity -->
  <path d="M 95 55 Q 105 45 180 48 Q 215 50 225 65 L 220 75 Q 200 62 140 60 Q 105 62 95 70 Z"
    fill="#1a1228" stroke="#4a3860" stroke-width="1.2" opacity="0.85"/>

  <!-- Hard Palate -->
  <path d="M 95 75 Q 100 90 140 98 Q 180 105 215 95 Q 220 85 220 75"
    fill="url(#boneG-nasal_ml)" stroke="#8a7a65" stroke-width="1.8" opacity="0.9"/>
  <!-- Alveolar Ridge -->
  <circle cx="98" cy="88" r="5" fill="#c4b49a" stroke="#8a7a65" stroke-width="1" opacity="0.65"/>

  <!-- Upper Incisor -->
  <path d="M 78 108 L 82 108 L 84 130 L 76 130 Z" fill="#f0ebe4" stroke="#b8ad9a" stroke-width="1"/>

  <!-- Upper Lip -->
  <path d="M 68 125 Q 60 128 58 132 Q 56 128 60 122 Q 65 118 72 120" fill="#c87080" stroke="#a35060" stroke-width="1.5" opacity="0.85"/>
  <line x1="56" y1="132" x2="72" y2="132" stroke="#731628" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lower Teeth (with jaw drop) -->
  <g transform="translate(0, 0)">
    <path d="M 76 146 L 84 146 L 82 162 L 78 162 Z" fill="#e8e3dc" stroke="#b8ad9a" stroke-width="1"/>
  </g>

  <!-- Lower Lip -->
  <path d="M 68 133 Q 60 130 58 132 Q 56 136 60 140 Q 65 145 72 142" fill="#c87080" stroke="#b07060" stroke-width="1.5" opacity="0.85"/>

  <!-- Pharynx -->
  <path d="M 240 75 Q 248 100 252 140 Q 255 180 255 220 Q 252 260 248 290"
    fill="none" stroke="#6a4a55" stroke-width="2.5" opacity="0.6"/>
  <path d="M 220 75 Q 240 75 248 100 Q 252 140 255 180 Q 255 220 252 260 L 235 280
    Q 230 250 228 220 Q 225 180 222 140 Q 220 100 220 75 Z"
    fill="#1a1018" opacity="0.5"/>

  <!-- Velum (Soft Palate) & Uvula -->
  <path d="M 215 95 Q 222 115 218 140 Q 215 158 210 170" fill="none" stroke="#c87080" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="230" cy="178" rx="5" ry="8" fill="#c87080" stroke="#a35060" stroke-width="1"/>

  <!-- Epiglottis -->
  <path d="M 230 225 Q 225 210 228 195 Q 232 185 238 180" fill="none" stroke="#8a7050" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

  <!-- Larynx / Trachea -->
  <path d="M 222 260 Q 218 275 220 295 Q 222 310 225 325" fill="none" stroke="#5a4a55" stroke-width="2" opacity="0.5"/>
  <path d="M 248 260 Q 252 275 250 295 Q 248 310 245 325" fill="none" stroke="#5a4a55" stroke-width="2" opacity="0.5"/>
  <line x1="224" y1="280" x2="246" y2="280" stroke="#4a3a45" stroke-width="1.5" opacity="0.4"/>
  <line x1="223" y1="295" x2="247" y2="295" stroke="#4a3a45" stroke-width="1.5" opacity="0.4"/>
  <line x1="224" y1="310" x2="246" y2="310" stroke="#4a3a45" stroke-width="1.5" opacity="0.4"/>

  <!-- Vocal Folds -->
  <g transform="translate(235, 255)">
    <line x1="-8" y1="-3" x2="0" y2="0" stroke="#a878b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="-3" x2="0" y2="0" stroke="#a878b8" stroke-width="2.5" stroke-linecap="round"/>
    
      <circle cx="0" cy="0" r="5" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.9">
        <animate attributeName="r" values="5;18;5" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3.5" fill="#a855f7">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="0.45s" repeatCount="indefinite"/>
      </circle>
  </g>

  <!-- Floor of mouth -->
  <path d="M 78 165 Q 100 185 140 200 Q 180 210 210 225 Q 225 235 235 250" fill="none" stroke="#6a4a50" stroke-width="1.5" opacity="0.4"/>

  <!-- Tongue Body -->
  <path d="M 85 155 Q 100 148 130 150 Q 165 158 195 178 Q 210 198 218 218 Q 212 232 182 232 Q 142 226 112 208 Q 86 188 85 170 Z" fill="url(#tngG-nasal_ml)" stroke="#9a4030" stroke-width="1.8"/>
  
    <path d="M 102 162 Q 135 155 165 165" fill="none" stroke="#b86855" stroke-width="0.8" opacity="0.4"/>
    <path d="M 108 178 Q 142 170 172 180" fill="none" stroke="#b86855" stroke-width="0.6" opacity="0.3"/>

  <!-- Articulatory Focus Marker -->
  <circle cx="70" cy="138" r="6" fill="#22d3ee" opacity="0.75"/>
  <circle cx="70" cy="138" r="10" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.35"/>

  <!-- Oral Airflow -->
  <path d="" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"
    stroke-dasharray="6 6" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="0.85s" repeatCount="indefinite"/>
  </path>

  
  
    <path d="M 218 120 Q 180 65 120 55 Q 100 55 75 70" fill="none" stroke="#f59e0b"
      stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="40;0" dur="0.85s" repeatCount="indefinite"/>
    </path>

  <!-- Anatomical Labels -->
  <g font-size="8" fill="#64748b" font-family="monospace" opacity="0.7">
    <text x="130" y="50">C. Nasal</text>
    <text x="130" y="108">Paladar Duro</text>
    <text x="250" y="120">Velo</text>
    <text x="260" y="200">Faringe</text>
    <text x="252" y="252">Laringe</text>
  </g>

  <text x="200" y="330" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Resonancia 100% Nasal</text>
</svg>