<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <linearGradient id="skinG-vowel_long_if" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddb89a"/>
      <stop offset="100%" stop-color="#c9956c"/>
    </linearGradient>
    <linearGradient id="lipG-vowel_long_if" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8788a"/>
      <stop offset="100%" stop-color="#b83b58"/>
    </linearGradient>
    <radialGradient id="cavG-vowel_long_if" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e060a"/>
      <stop offset="100%" stop-color="#0a0103"/>
    </radialGradient>
  </defs>
  <rect width="300" height="260" rx="16" fill="#0b0f1a"/>

  <!-- Voicing Status Badge: SONORO -->
  <g transform="translate(208, 14)">
    <rect width="78" height="20" rx="10" fill="#a855f7" fill-opacity="0.18" stroke="#c084fc" stroke-width="1"/>
    <circle cx="10" cy="10" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="21" y="13.5" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">SONORO</text>
  </g>
  <!-- Larynx Acoustic Waves (Vocal Vibration) -->
  <g opacity="0.8">
    <path d="M 136 222 Q 150 226 164 222" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="0.45s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 227 Q 150 232 170 227" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.45s" repeatCount="indefinite"/>
    </path>
  </g>

  
  <!-- Face contour -->
  <ellipse cx="150" cy="140" rx="100" ry="120" fill="url(#skinG-vowel_long_if)" opacity="0.12"/>
  <!-- Nose base & nostrils -->
  <path d="M 136 72 Q 142 68 150 69 Q 158 68 164 72" fill="none" stroke="#966b4f" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="143" cy="73" rx="3.5" ry="1.8" fill="#2d170d" opacity="0.4"/>
  <ellipse cx="157" cy="73" rx="3.5" ry="1.8" fill="#2d170d" opacity="0.4"/>
  <!-- Philtrum -->
  <path d="M 147 75 Q 146 85 144 96" stroke="#8b5a38" stroke-width="1" stroke-linecap="round" opacity="0.3" fill="none"/>
  <path d="M 153 75 Q 154 85 156 96" stroke="#8b5a38" stroke-width="1" stroke-linecap="round" opacity="0.3" fill="none"/>
  <!-- Upper lip -->
  <path d="M 92 135 C 108 120, 130 118, 150 122 C 170 118, 192 120, 208 135 C 190 130, 170 129, 150 130 C 130 129, 110 130, 92 135 Z"
    fill="url(#lipG-vowel_long_if)" stroke="#8e243c" stroke-width="1.2"/>
  <!-- Oral cavity -->
  <ellipse cx="150" cy="135" rx="55" ry="8" fill="url(#cavG-vowel_long_if)" stroke="#220306" stroke-width="1"/>
  <!-- Upper teeth (individual) -->
  <clipPath id="clip-sp-vowel_long_if"><ellipse cx="150" cy="135" rx="55" ry="8"/></clipPath>
  <g clip-path="url(#clip-sp-vowel_long_if)">
    <rect x="118.0" y="126" width="11.8" height="14.1" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="130.8" y="126" width="11.8" height="14.1" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="143.6" y="126" width="11.8" height="14.1" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="156.4" y="126" width="11.8" height="14.1" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="169.2" y="126" width="11.8" height="14.1" rx="1.5" fill="#f4f0eb" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="126.0" y="137" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="138.0" y="137" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="150.0" y="137" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
    <rect x="162.0" y="137" width="11.0" height="10.2" rx="1.5" fill="#e8e3dc" stroke="#c4bcaf" stroke-width="0.5"/>
  </g>
  <!-- Lower lip -->
  <path d="M 92 135 C 112 140, 132 141, 150 141 C 168 141, 188 140, 208 135 C 196 156, 176 162, 150 162 C 124 162, 104 156, 92 135 Z"
    fill="url(#lipG-vowel_long_if)" stroke="#8e243c" stroke-width="1.2"/>
  <!-- Lower lip highlight -->
  <ellipse cx="150" cy="153" rx="20" ry="3.5" fill="white" opacity="0.22"/>
  <text x="150" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sonrisa Amplia y Tensa</text>
</svg>