services:
  - type: web
    name: guionbajo
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://guionbajo.vercel.app
      - key: MINIMAX_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
